name: Validar TWA web

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/twa-authoritative-flows-20260727

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1

      - name: Publicar diagnóstico TypeScript
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('typecheck.log', 'utf8').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Diagnóstico temporário do TypeScript\n\n\`\`\`text\n${output}\n\`\`\``
            });

      - name: Interromper se TypeScript falhou
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Validar fluxos autoritativos
        run: npm run test:authoritative-flows

      - name: Validar avisos e bloqueios financeiros
        run: npm run test:financial-access

      - name: Gerar build de produção
        run: npm run build
