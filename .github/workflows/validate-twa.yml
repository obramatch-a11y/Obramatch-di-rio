name: Validar TWA web

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/twa-authoritative-flows-20260727

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Validar fluxos autoritativos
        run: npm run test:authoritative-flows

      - name: Validar avisos e bloqueios financeiros
        run: npm run test:financial-access

      - name: Gerar build de produção
        run: npm run build
